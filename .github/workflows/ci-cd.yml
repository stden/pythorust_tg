name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"      # skip DWARF generation in CI — faster Rust builds, smaller cache
  CARGO_PROFILE_TEST_DEBUG: "0"
  UV_LINK_MODE: copy

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows:
              - ".github/workflows/**"
              - ".github/dependabot.yml"
            python:
              - "pyproject.toml"
              - "requirements*.txt"
              - "*.py"
              - "chat_analysis/**"
              - "features/**"
              - "integrations/**"
              - "python/**"
              - "tests/**/*.py"
            rust:
              - "Cargo.toml"
              - "Cargo.lock"
              - "src/**"
              - "benches/**/*.rs"
              - "tests/**/*.rs"

  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml

      - name: Install dependencies
        # Tests use the pure-Python packages, not the compiled extension — skip
        # building maturin (faster, no Rust needed in the test job).
        # uv.lock is not committed; uv resolves from pyproject.toml each run.
        run: uv sync --no-install-project --dev --no-progress

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run fast tests
        if: github.event_name == 'pull_request'
        run: uv run --no-sync python -m pytest -q

      - name: Run tests with coverage
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python -m pytest --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=50 -q
        # Telegram scripts that require interactive sessions are intentionally not executed in CI.

  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 5
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 25
    # mold cuts link time ~2-5x — this repo links 53 binaries + a cdylib against
    # heavy deps (tokio, pyo3, teloxide, kube, grammers), so linking dominates.
    env:
      RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-clippy
          cache-on-failure: true

      - name: Run clippy
        run: >
          cargo clippy --workspace --all-targets --all-features --
          -D warnings
          -A clippy::unnecessary_cast
          -A clippy::unnecessary_lazy_evaluations
          -A clippy::unnecessary_literal_unwrap
          -A clippy::print_with_newline

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          cache-on-failure: true

      - name: Run tests
        run: cargo nextest run --workspace --all-features

      - name: Run doctests
        run: cargo test --workspace --doc --all-features

  rust-coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    needs: [changes, rust-test]
    timeout-minutes: 25
    env:
      RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    if: |
      github.event_name != 'pull_request' &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.workflows == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-coverage
          cache-on-failure: true

      - name: Install tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        # Measure the library (the tested core); thin/bot bins are CLI entry points.
        run: cargo tarpaulin --lib --engine llvm --out xml --skip-clean --fail-under 30

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [changes, python, rust-fmt, rust-clippy, rust-test]
    timeout-minutes: 3
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "A required CI job failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required CI job was cancelled."
            exit 1
          fi
          echo "Required CI jobs passed or were skipped by path filters."

  build-rust:
    name: Build Rust release artifacts
    runs-on: ubuntu-latest
    needs: [rust-fmt, rust-clippy, rust-test]
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release
          cache-on-failure: true

      - name: Build Rust binaries
        run: cargo build --workspace --all-features --release

      - name: Package Rust binaries
        run: |
          mkdir -p artifacts/rust
          find target/release -maxdepth 1 -type f -executable -print0 |
            xargs -0 -I{} cp {} artifacts/rust/
          tar -czf artifacts/telegram-reader-linux-x86_64.tar.gz -C artifacts/rust .

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: artifacts/telegram-reader-linux-x86_64.tar.gz

  build-python:
    name: Build Python distributions
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml

      - name: Cache Rust build
        # maturin compiles the PyO3 cdylib — cache its artifacts across tag builds.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: maturin-build
          cache-on-failure: true

      - name: Build Python packages
        run: |
          uv sync --dev --no-progress
          uv build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-rust, build-python]
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: artifacts

      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: artifacts/python-dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/telegram-reader-linux-x86_64.tar.gz
            artifacts/python-dist/*.whl
            artifacts/python-dist/*.tar.gz
          generate_release_notes: true
