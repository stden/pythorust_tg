[dependencies]
# Telegram MTProto client
grammers-client = "0.8"
grammers-session = "0.8"
grammers-tl-types = "0.8"
grammers-mtsender = "0.8"

# Async runtime
tokio = { version = "1.49", features = ["full", "signal"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Metrics & monitoring
prometheus = { version = "0.14", features = ["process"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
bytes = "1.11"

# File locking (cross-platform)
fs2 = "0.4"

# Directory traversal
walkdir = "2.5"

# HTTP client for OpenAI
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Async OpenAI client
async-openai = { version = "0.32", features = ["chat-completion", "embedding"] }

# Environment variables
dotenvy = "0.15"

# Regex for message filtering
regex = "1.12"

# Base64 encoding (for Gemini image API)
base64 = "0.22"

# HTTP server (for metrics endpoint)
hyper = { version = "1", features = ["server", "http1"] }

# Vector database (Qdrant)
qdrant-client = { version = "1.16", default-features = false, features = ["download_snapshots", "serde"] }

# Graph database (Neo4j)
neo4rs = "0.8"

# UUID generation
uuid = { version = "1.19", features = ["v4", "serde"] }

# Futures utilities
futures = "0.3"

# Lazy statics
once_cell = "1.21"

# CSV export
csv = "1.4"

# JSON Schema (for API requests)
schemars = "0.8"

# MySQL database (using mysql_async to avoid sqlite conflict)
mysql_async = { version = "0.36", features = ["chrono"] }

# Telegram bot framework (polling mode)
teloxide = { version = "0.17", default-features = true }
# Random prompt selection
rand = "0.8"

# Kubernetes client
kube = { version = "3.0", features = ["client", "config", "runtime", "derive"] }
k8s-openapi = { version = "0.27", features = ["v1_32"] }

# Python bindings (PyO3)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }

[dev-dependencies]
tokio-test = "0.4"
httpmock = "0.8"
tempfile = "3.24"
criterion = "0.5"

# =============================================================================
# Build Profiles
# =============================================================================

# Dev profile — fastest possible build for development
[profile.dev]
strip = "debuginfo"
opt-level = 0
debug = 1
incremental = true
codegen-units = 256      # More units = faster compilation
split-debuginfo = "unpacked"

# Dev dependencies — build optimized for faster tests
[profile.dev.package."*"]
opt-level = 2            # Optimize dependencies
debug = false            # Faster linking by skipping dependency debug info

# Release profile — balance build speed and performance
[profile.release]
opt-level = 3
lto = "thin"             # Thin LTO instead of fat — much faster
codegen-units = 16       # More units = faster compilation
panic = "abort"
strip = true
incremental = true       # Incremental build

# Release-fast — faster release build for CI/CD
[profile.release-fast]
inherits = "release"
lto = false              # No LTO — faster
codegen-units = 16
incremental = true

# Release-optimized — maximum performance (slow build)
[profile.release-optimized]
inherits = "release"
opt-level = 3
lto = "fat"              # Full LTO for maximum optimization
codegen-units = 1        # Single unit — best optimization
strip = true
incremental = false

# Bench profile — must use panic="unwind" for criterion
[profile.bench]
opt-level = 3
debug = 1
panic = "unwind"          # Criterion requires unwind for benchmarks
lto = false               # Faster compilation for benchmarks
incremental = true

[[bench]]
name = "text_processing"
harness = false

